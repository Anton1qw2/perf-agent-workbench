[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-chat"
version = "0.1.0"
description = "Web and TUI frontend for a LangGraph performance optimization workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "langgraph>=1.0,<2", "textual>=1.0,<7",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "cryptography>=44"]
mcp = ["mcp>=1.26,<2"]
secrets = ["cryptography>=44"]

[project.scripts]
perf-chat-api = "perf_chat.api:main"
perf-chat-worker = "perf_chat.worker:main"
perf-chat-tui = "perf_chat.ui.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"perf_chat.ui" = ["web/*"]
"perf_chat.profiler_docs_agent" = ["Perf.md"]
"perf_chat.profiler_analysis_agent" = ["instructions/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
